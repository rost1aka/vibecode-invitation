<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050806" />
    <title>Створити запрошення 🤖☕</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&display=swap"
    />
  </head>
  <body>
    <div class="term term-wide">
      <header class="bar">
        <span>~/vibecode $ ./create</span>
        <span id="bar-tz" class="bar-status"></span>
      </header>

      <h1 class="title title-builder">Нове запрошення<span class="cursor" aria-hidden="true"></span></h1>

      <div class="builder">
        <form id="form" class="builder-form" novalidate>
          <div class="field">
            <label for="name">name* <span class="dim">// імʼя друга, як у паспорті</span></label>
            <input id="name" class="in" maxlength="40" required placeholder="Андрій" autocomplete="off" />
          </div>

          <div class="field">
            <label for="vocative">vocative <span class="dim">// звертання, авто</span></label>
            <span class="row">
              <input id="vocative" class="in" maxlength="40" autocomplete="off" />
              <button id="vocative-reset" class="icon-btn" type="button" aria-label="Повернути автоматичне звертання" title="Повернути автоматичне" hidden>↺</button>
            </span>
          </div>

          <fieldset class="field">
            <legend>gender</legend>
            <div class="seg">
              <label><input type="radio" name="gender" value="" checked /> авто</label>
              <label><input type="radio" name="gender" value="m" /> ч</label>
              <label><input type="radio" name="gender" value="f" /> ж</label>
            </div>
          </fieldset>

          <div class="field-row">
            <div class="field field-grow">
              <label for="location">location</label>
              <input id="location" class="in" maxlength="100" placeholder="Lviv IT Park" autocomplete="off" />
            </div>
            <div class="field">
              <label for="duration">duration</label>
              <select id="duration" class="in">
                <option value="30">30 хв</option>
                <option value="60">60 хв</option>
                <option value="90">90 хв</option>
                <option value="120" selected>120 хв</option>
                <option value="180">180 хв</option>
                <option value="240">240 хв</option>
              </select>
            </div>
          </div>

          <fieldset class="field">
            <legend>slots[] <span class="dim">// <span id="slot-count">0</span> / 12</span></legend>
            <div id="slots" class="slot-rows"></div>
            <button id="add-slot" class="add-btn" type="button">+ додати слот</button>
            <p id="tz-hint" class="hint"></p>
            <p id="no-slots-warning" class="hint warn" hidden>! Без слотів друг просто напише тобі, коли зручно</p>
          </fieldset>
        </form>

        <section class="result" aria-label="Результат">
          <p class="hint">preview.render()</p>
          <div class="preview-card">
            <p class="dim">&gt; incoming_invite.txt</p>
            <p id="preview" class="preview"></p>
            <p id="preview-meta" class="preview-meta"></p>
          </div>

          <div class="field">
            <label for="link">output.url</label>
            <textarea id="link" class="in link-out" readonly rows="4" placeholder="// введи імʼя друга, і тут зʼявиться посилання"></textarea>
          </div>

          <div class="result-actions">
            <button id="copy" class="btn btn-primary btn-sm" type="button">Скопіювати</button>
            <button id="open" class="btn btn-ghost btn-sm" type="button">Переглянути</button>
          </div>
        </section>
      </div>
    </div>
    <div class="crt" aria-hidden="true"></div>
    <script type="module" src="/src/create.ts"></script>
  </body>
</html>
